name: Build and Test

on:
  push:
    branches: [ main, develop ]
    # Docs-only commits do not publish. Tag pushes are unaffected: GitHub does not
    # apply path filters to tags, so `git tag vX.Y.Z` still releases.
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ main ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dotnet-version: ['10.0.x']

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ matrix.dotnet-version }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test
      # FailedTestLoggingIntegrationTests is a demo of the failed-test log exporter: every test
      # in it calls Assert.Fail on purpose, so it is excluded from the CI gate.
      run: |
        dotnet test \
          --solution xUnitOTel.sln \
          --no-build \
          --configuration Release \
          --filter-not-class "xUnitOTel.Tests.FailedTestLoggingIntegrationTests"


    - name: Pack NuGet package
      run: dotnet pack --no-build --configuration Release --output ./nupkg

    - name: Upload NuGet package artifacts
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: ./nupkg/*.nupkg
